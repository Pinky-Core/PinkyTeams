main: me.pinkycore.pinkyteams.PinkyTeams
version: ${project.version}
name: PinkyTeams
author: PinkyCore
api-version: "1.20"
softdepend: [Vault, PlaceholderAPI, TAB]

commands:
  clan:
    description: Comandos principales de los clanes.
    aliases: [klan]
  clanadmin:
    description: Administra el plugin PinkyTeams.
  scstats:
    description: Muestra estadísticas del jugador.

permissions:
  pinkyteams.*:
    description: Acceso completo a PinkyTeams.
    default: false
    children:
      pinkyteams.admin: true
      pinkyteams.user: true
      pinkyteams.bypass.homecooldown: true
      pinkyteams.bypass.homedelay: true
      pinkyteams.bypass.nametag: true

  pinkyteams.admin:
    description: Acceso a comandos administrativos.
    default: op
    children:
      pinkyteams.admin.nametagreset: true

  pinkyteams.user:
    description: Acceso a todos los comandos de usuario.
    default: false
    children:
      pinkyteams.user.create: true
      pinkyteams.user.sethome: true
      pinkyteams.user.delhome: true
      pinkyteams.user.home: true
      pinkyteams.user.list: true
      pinkyteams.user.info: true
      pinkyteams.user.join: true
      pinkyteams.user.leave: true
      pinkyteams.user.disband: true
      pinkyteams.user.kick: true
      pinkyteams.user.ally: true
      pinkyteams.user.ff: true
      pinkyteams.user.chat: true
      pinkyteams.user.stats: true
      pinkyteams.user.invite: true
      pinkyteams.user.economy: true
      pinkyteams.user.slots: true
      pinkyteams.user.top: true
      pinkyteams.user.rank: true
      pinkyteams.user.accept: true
      pinkyteams.user.decline: true
      pinkyteams.user.resign: true
      pinkyteams.user.report: true
      pinkyteams.user.edit: true
      pinkyteams.user.war: true

  # Permisos específicos para comandos/clanes
  pinkyteams.user.create:
    description: Permiso para crear un clan.
    default: false

  pinkyteams.user.sethome:
    description: Permiso para ir a la home.
    default: false

  pinkyteams.user.delhome:
    description: Permiso para borrar la home del clan.
    default: false

  pinkyteams.user.home:
    description: Permiso para home.
    default: false

  pinkyteams.bypass.homecooldown:
    default: op

  pinkyteams.bypass.homedelay:
    default: op

  pinkyteams.bypass.nametag:
    description: Allows seeing hidden nametags (privacy bypass)
    default: op
  pinkyteams.admin.nametagreset:
    description: Permite usar /clanadmin nametagreset
    default: op

  pinkyteams.user.list:
    description: Permiso para listar clanes.
    default: false

  pinkyteams.user.info:
    description: Permiso para consultar información de clanes.
    default: false

  pinkyteams.user.join:
    description: Permiso para unirse a un clan.
    default: false

  pinkyteams.user.leave:
    description: Permiso para salir de un clan.
    default: false

  pinkyteams.user.disband:
    description: Permiso para disolver un clan.
    default: false

  pinkyteams.user.kick:
    description: Permiso para expulsar a un miembro de un clan.
    default: false

  pinkyteams.user.ally:
    description: Permiso para gestionar alianzas.
    default: false

  pinkyteams.user.ff:
    description: Permiso para configurar fuego amigo.
    default: false

  pinkyteams.user.chat:
    description: Permiso para usar chat de clan.
    default: false

  pinkyteams.user.stats:
    description: Permiso para ver estadísticas de clanes.
    default: false

  pinkyteams.user.invite:
    description: Permiso para invitar jugadores a un clan.
    default: false

  pinkyteams.user.economy:
    description: Permiso para depositar o retirar dinero del banco del clan.
    default: false

  pinkyteams.user.slots:
    description: Permiso para ver y mejorar los slots del clan.
    default: false

  pinkyteams.user.top:
    description: Permiso para ver el ranking de clanes.
    default: false

  pinkyteams.user.rank:
    description: Permiso para gestionar rangos del clan.
    default: false

  pinkyteams.user.accept:
    description: Permiso para aceptar invitaciones a clanes.
    default: false

  pinkyteams.user.decline:
    description: Permiso para rechazar invitaciones a clanes.
    default: false

  pinkyteams.user.resign:
    description: Permiso para renunciar a un clan.
    default: false

  pinkyteams.user.report:
    description: Permiso para reportar clanes.
    default: false

  pinkyteams.user.edit:
    description: Permiso para editar nombre, tag y privacidad del clan.
    default: false

  pinkyteams.user.war:
    description: Permiso para gestionar guerras de clan.
    default: false

  # Compatibility aliases. Remove after permission groups migrate to pinkyteams.*.
  vanguardclans.admin:
    default: false
    children:
      pinkyteams.admin: true
  vanguardclans.admin.nametagreset:
    default: false
    children:
      pinkyteams.admin.nametagreset: true
  vanguardclans.bypass.homecooldown:
    default: false
    children:
      pinkyteams.bypass.homecooldown: true
  vanguardclans.bypass.homedelay:
    default: false
    children:
      pinkyteams.bypass.homedelay: true
  vanguardclans.bypass.nametag:
    default: false
    children:
      pinkyteams.bypass.nametag: true
  vanguardclans.user:
    default: false
    children:
      pinkyteams.user: true
  vanguardclans.user.create: {default: false, children: {pinkyteams.user.create: true}}
  vanguardclans.user.sethome: {default: false, children: {pinkyteams.user.sethome: true}}
  vanguardclans.user.delhome: {default: false, children: {pinkyteams.user.delhome: true}}
  vanguardclans.user.home: {default: false, children: {pinkyteams.user.home: true}}
  vanguardclans.user.list: {default: false, children: {pinkyteams.user.list: true}}
  vanguardclans.user.info: {default: false, children: {pinkyteams.user.info: true}}
  vanguardclans.user.join: {default: false, children: {pinkyteams.user.join: true}}
  vanguardclans.user.leave: {default: false, children: {pinkyteams.user.leave: true}}
  vanguardclans.user.disband: {default: false, children: {pinkyteams.user.disband: true}}
  vanguardclans.user.kick: {default: false, children: {pinkyteams.user.kick: true}}
  vanguardclans.user.ally: {default: false, children: {pinkyteams.user.ally: true}}
  vanguardclans.user.ff: {default: false, children: {pinkyteams.user.ff: true}}
  vanguardclans.user.chat: {default: false, children: {pinkyteams.user.chat: true}}
  vanguardclans.user.stats: {default: false, children: {pinkyteams.user.stats: true}}
  vanguardclans.user.invite: {default: false, children: {pinkyteams.user.invite: true}}
  vanguardclans.user.economy: {default: false, children: {pinkyteams.user.economy: true}}
  vanguardclans.user.slots: {default: false, children: {pinkyteams.user.slots: true}}
  vanguardclans.user.top: {default: false, children: {pinkyteams.user.top: true}}
  vanguardclans.user.rank: {default: false, children: {pinkyteams.user.rank: true}}
  vanguardclans.user.accept: {default: false, children: {pinkyteams.user.accept: true}}
  vanguardclans.user.decline: {default: false, children: {pinkyteams.user.decline: true}}
  vanguardclans.user.resign: {default: false, children: {pinkyteams.user.resign: true}}
  vanguardclans.user.report: {default: false, children: {pinkyteams.user.report: true}}
  vanguardclans.user.edit: {default: false, children: {pinkyteams.user.edit: true}}
  vanguardclans.user.war: {default: false, children: {pinkyteams.user.war: true}}
