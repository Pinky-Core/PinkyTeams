config-version: 5

###############################################################################
#                       PINKYTEAMS PLACEHOLDERS                               #
#                                                                             #
# General (PlaceholderAPI):                                                   #
# %pinkyteams_prefix%                       - Plugin prefix                    #
# %pinkyteams_player_money%                 - Player balance                  #
# %pinkyteams_clan_leader%                  - Clan leader                     #
# %pinkyteams_clan_founder%                 - Clan founder                    #
# %pinkyteams_clan_name%                    - Plain clan name                 #
# %pinkyteams_clan_tag%                     - Colored clan tag/name            #
# %pinkyteams_clan_money%                   - Clan bank balance               #
# %pinkyteams_clan_kills%                   - Total member kills              #
# %pinkyteams_clan_deaths%                  - Total member deaths             #
# %pinkyteams_clan_membercount%             - Total members                   #
# %pinkyteams_clan_membercount_online%      - Online members                  #
# %pinkyteams_clan_membercount_offline%     - Offline members                 #
# %pinkyteams_clan_war_opponent%            - Active war opponent             #
# %pinkyteams_clan_war_score%               - Clan score in active war        #
# %pinkyteams_clan_war_opponent_score%      - Opponent score                  #
# %pinkyteams_clan_war_time_left%           - Remaining war seconds           #
# %pinkyteams_season_name%                  - Current season name             #
# %pinkyteams_season_active%                - true/false                      #
# %pinkyteams_season_time_left%             - Remaining season seconds        #
#                                                                             #
# Rankings:                                                                   #
# %pinkyteams_top_<metric>_<position>%                                        #
# %pinkyteams_top_<metric>_<position>_<field>%                                #
#   metric   = kda, points, money, members                                    #
#   position = 1, 2, 3...                                                     #
#   field    = tag, name, value, money, points, members, kills, deaths,       #
#              kda, kda_total, kda_avg                                        #
# Examples:                                                                   #
# %pinkyteams_top_kda_1_name%                                                 #
# %pinkyteams_top_points_1_value%                                             #
# %pinkyteams_top_money_3_tag%                                                #
# %pinkyteams_top_members_2_members%                                          #
#                                                                             #
# Relational (TAB / PlaceholderAPI):                                          #
# %rel_pinkyteams_nametag%                    - Complete target nametag        #
# %rel_pinkyteams_nametag_obfuscate%          - Obfuscation prefix + reset    #
# %rel_pinkyteams_nametag_obfuscate_prefix%   - Obfuscation prefix            #
# %rel_pinkyteams_nametag_obfuscate_reset%    - Formatting reset              #
# %rel_pinkyteams_nametag_obfuscate_suffix%   - Alias of reset                #
###############################################################################


prefix: "&7[&d&lᴘɪɴᴋʏᴛᴇᴀᴍꜱ&7]"


placeholders:
  no-clan-value: "N/A" # text to show for clan placeholders when player has no clan (a player without clan will show "N/A", empty string shows nothing)

compatibility:
  # Temporary bridge for existing TAB, scoreboard and chat configurations.
  # Disable after replacing every %vanguardclans_*% placeholder with %pinkyteams_*%.
  legacy-placeholders: true
  # Prevents both plugins from changing clan data after a successful migration.
  # The old JAR must still be removed manually before the next restart.
  disable-legacy-plugin-after-migration: true

wars:
  enabled: true
  request-expiration-seconds: 300
  duration-seconds: 3600
  score-to-win: 20
  winner-bank-reward: 0
  anti-farm:
    cooldown-seconds: 300

seasons:
  enabled: true
  default-duration-days: 30
  reset-points-on-end: true
  ranking-size: 10
  rewards:
    # Commands are executed as console. Available: {clan}, {leader}, {position}, {points}
    "1": []
    "2": []
    "3": []

commands:
  # When true, /clan without arguments will show the main help page.
  # When false, /clan without arguments will return a "Command not found" message.
  show-main-help-page: true
  # Extra aliases for /clan. Example for Turkish servers: /klan
  # Every alias executes the same subcommands as /clan.
  clan-aliases:
    - "klan"

time-format:
  days: "d"
  hours: "h"
  minutes: "m"
  seconds: "s"

storage:
  # Storage type: mariadb, mysql, h2, sqlite, yaml
  # YAML is recommended for small servers or when you don't have a database
  type: "sqlite"

  # MariaDB configuration
  mariadb:
    host: "localhost"
    port: 3306
    database: "pinkyteams"
    username: "root"
    password: "password"

  # MySQL configuration
  mysql:
    host: "localhost"
    port: 3306
    database: "pinkyteams"
    username: "root"
    password: "password"

  # H2 configuration (file-based, no additional setup needed)
  h2:
    # H2 database file will be created in the plugin folder
    # No additional configuration needed

  # SQLite configuration (file-based, no additional setup needed)
  sqlite:
    # SQLite database file will be created in the plugin folder
    # No additional configuration needed

  # YAML configuration (file-based, no additional setup needed)
  yaml:
    # YAML data file will be created in the plugin folder
    # No additional configuration needed

welcome-message:
  enabled: true
  delay-seconds: 1 # delay antes de enviar los mensajes de bienvenida (segundos)

  no-clan:
    - ""
    - "¡Welcome Back!"
    - "Use /clan create to create your clan."
    - ""

  self-clan:
    - ""
    - "You're on %pinkyteams_clan_name%"
    - "Online Members: %pinkyteams_clan_membercount_online% / %pinkyteams_clan_membercount%"
    - ""

  to-clan:
    - ""
    - "%player_name% connected"
    - ""


clan_home:
  cooldown: 30 
  teleport_delay: 5 
  safe-location-protection:
    enabled: true
    check-before-teleport: true
    require-solid-ground: true
    require-feet-and-head-space: true
    block-dangerous-materials: true 


clan:
  default-privacy: "private" # default privacy for newly created clans (public/private)
  creation-announcement:
    enabled: false
  disband-confirmation:
    enabled: true

nametag-privacy:
  enabled: false
  provider: "internal" # internal / tab / unt (unt = UnlimitedNametags, tab = TAB)
  mode: "obfuscate" # none / hide / obfuscate
  bypass-permission: "" # permission to bypass nametag privacy effects (ej: pinkyteams.nametag.bypass)
  show-no-clan-names: true # default value to show/hide nametags of players without clan
  visibility:
    same-clan: "always"        # always / hideforotherteams / hideforownteam / never
    enemy-clan: "always"        # hide enemy teams
    no-clan: "always"          # show players without clan
  obfuscate:
    enabled: true
    relations:
      - "enemy-clan"          # same-clan / enemy-clan / no-clan
    prefix: "&k######"         # prefix apply to obfuscated nametags
    reset: "&r"                # reset code after obfuscated nametags
  force-override: true # force override other nametag plugins (may cause conflicts)
  refresh-interval-ticks: 20 # interval to refresh nametags (in ticks, 20 ticks = 1 second)


blocked-worlds:
  - world_nether
  - world_the_end
  - parkoureventos


max-clans: 0 # 0 = unlimited

anti-multiaccount:
  enabled: true
  max-clans-per-ip: 1
  only-when-global-limit: true

clan-slots:
  enabled: false
  use-points: true
  # When use-points is false, this is the maximum number of slots a clan can buy (0 = unlimited).
  static-limit: 0
  # Base slots and points per kill (if use-points is true)
  base-slots: 5
  points-per-kill: 1
  upgrades:
    - cost: 25
      slots: 2
    - cost: 50
      slots: 3

gui:
  # Visual theme for all inventories. Invalid materials/sounds safely use defaults.
  theme:
    primary-color: "pink"
    filler-material: "PINK_STAINED_GLASS_PANE"
  sounds:
    enabled: true
    click: "UI_BUTTON_CLICK"
    refresh: "BLOCK_NOTE_BLOCK_PLING"
  # Main control center (54 slots, indexes 0-53). Every position and material is editable.
  main:
    items:
      overview: {slot: 4, material: "PINK_BANNER"}
      members: {slot: 19, material: "PLAYER_HEAD"}
      invites: {slot: 20, material: "PAPER"}
      allies: {slot: 21, material: "FIREWORK_ROCKET"}
      bank: {slot: 22, material: "GOLD_INGOT"}
      wars: {slot: 23, material: "IRON_SWORD"}
      home: {slot: 24, material: "ENDER_PEARL"}
      edit: {slot: 25, material: "NAME_TAG"}
      top: {slot: 29, material: "NETHER_STAR"}
      ranks: {slot: 30, material: "ANVIL"}
      slots: {slot: 31, material: "CHEST"}
      bank-history: {slot: 32, material: "WRITABLE_BOOK"}
      refresh: {slot: 33, material: "CLOCK"}
      close: {slot: 49, material: "BARRIER"}
  privacy:
    public: "&aPublic"
    private: "&cPrivate"
  role-labels:
    leader: "&cLeader"
    co-leader: "&6Co-Leader"
    member: "&7Member"
  display:
    clan-name-template: "{colored}"
    top-clan-name-template: "{colored}"
    member-name-template: "{status}{player}"
    member-status:
      online: "&a"
      offline: "&7"


clan-name:
  # Charact. limitations for clan names (0 = unlimited)
  min-length: 0
  max-length: 16
  regex:
    enabled: false
    # Default allows only letters, numbers and underscores.
    pattern: "^[A-Za-z0-9_]+$"
  rename:
    cooldown:
      enabled: false
      seconds: 86400
    fee:
      enabled: false
      amount: 1000

clan-tag:
  regex:
    enabled: false
    # Applies to the visible tag/name after color codes are stripped.
    pattern: "^[A-Za-z0-9_]+$"

economy:
  enabled: true
  system: "Vault" # Vault / Internal (PinkyTeams economy system)
  bank:
    max-balance: 0 # 0 = unlimited
    audit-display-limit: 10

  cost:
    create-clan: 1000
  earn:
    delete-clan: 100
    kill-enemy: 0

names-blocked:
  enabled: true
  blocked:
    - "shit"
    - "fuck"
    - "nigga"
    - "KKK"



discord:
  sql_status_webhook: "https://discord.com/api/webhooks/..."
  sql_status_interval_minutes: 10
  webhooks:
    new-clan:
      enabled: false
      url: ""
      color: 3066993
      message: "**New clan created:** {clan} (leader: {leader})"
    top-leader:
      enabled: false
      url: ""
      color: 3447003
      message: "**{clan}** is now #1 in {metric} with {value}."
      metrics:
        - points
        - kda
        - money
        - members
      interval-seconds: 60
